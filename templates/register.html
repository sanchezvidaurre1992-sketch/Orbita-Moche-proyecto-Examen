<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Órbita Moche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; }
        .card-auth { background-color: #151c2c; border: 1px solid #263147; border-radius: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <a href="/" class="text-decoration-none text-white fs-4 fw-bold">
                        <i class="bi bi-globe-americas text-info me-2"></i>ÓRBITA MOCHE
                    </a>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <div class="card card-auth p-4 shadow-lg">
                    <h5 class="fw-bold text-white mb-3"><i class="bi bi-person-plus text-info me-2"></i>Crear Cuenta</h5>
                    <form method="POST" action="/register">
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Nombre Completo</label>
                            <input type="text" name="nombre" class="form-control bg-dark text-light border-secondary" required placeholder="Ej. Juan Pérez">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Correo Electrónico</label>
                            <input type="email" name="email" class="form-control bg-dark text-light border-secondary" required placeholder="correo@ejemplo.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Contraseña</label>
                            <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required placeholder="Mínimo 6 caracteres">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Rol en la Plataforma</label>
                            <select name="rol" class="form-select bg-dark text-light border-secondary">
                                <option value="investigador" selected>Investigador / Agricultor (Registrar y editar sus reportes)</option>
                                <option value="admin">Administrador (Control total de reportes y usuarios)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-info w-100 fw-bold text-dark mt-2">
                            Registrar Usuario
                        </button>
                    </form>

                    <div class="text-center mt-3 small">
                        <span class="text-secondary">¿Ya tienes cuenta?</span>
                        <a href="/login" class="text-info text-decoration-none fw-bold">Inicia sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
