<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Reporte | Órbita Moche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; }
        .card-dark { background-color: #151c2c; border: 1px solid #263147; border-radius: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-dark p-4 shadow-lg">
                    <h5 class="fw-bold text-info mb-3">
                        <i class="bi bi-pencil-square me-2"></i>Actualizar Reporte de Monitoreo #{{ reporte.id }}
                    </h5>
                    <form method="POST" action="/reportes/editar/{{ reporte.id }}">
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Zona / Cuenca Agrícola</label>
                            <select name="sector_id" class="form-select bg-dark text-light border-secondary" required>
                                {% for key, val in sectores.items() %}
                                <option value="{{ key }}" {% if key == reporte.sector_id %}selected{% endif %}>
                                    {{ val.nombre_es }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Fuente / Tipo de Pozo</label>
                            <input type="text" name="tipo_pozo" value="{{ reporte.tipo_pozo }}" class="form-control bg-dark text-light border-secondary" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Salinidad Medida (ppm)</label>
                            <input type="number" step="0.1" name="salinidad_ppm" value="{{ reporte.salinidad_ppm }}" class="form-control bg-dark text-light border-secondary" required>
                            <small class="text-secondary">(<1000: Bajo | 1000–1999: Moderado | ≥2000: Alto)</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Observaciones de Campo</label>
                            <textarea name="observaciones" rows="3" class="form-control bg-dark text-light border-secondary" required>{{ reporte.observaciones }}</textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-info fw-bold text-dark flex-fill">Guardar Cambios</button>
                            <a href="/dashboard" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
